# ============================================================
# Phase 06 — snappyHexMesh build configuration
# ============================================================
#
# User-editable settings only.
# Do not put spaces around "=".
# ============================================================


# ------------------------------------------------------------
# Main execution switches
# ------------------------------------------------------------

CASTELLATED_MESH=true
SNAP=true
ADD_LAYERS=false


# ------------------------------------------------------------
# locationInMesh
#
# This point must be inside the fluid region.
# Set it manually after checking the geometry.
# ------------------------------------------------------------

LOCATION_IN_MESH_X=0
LOCATION_IN_MESH_Y=0.1
LOCATION_IN_MESH_Z=0


# ------------------------------------------------------------
# Geometry scale
#
# Usually 1.0 when STL coordinates already use metres.
# ------------------------------------------------------------

STL_SCALE=1.0
